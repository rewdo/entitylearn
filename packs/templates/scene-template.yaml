# ============================================================
# EntityLearn Scene Template
# 复制此文件来创建你的场景定义
# ============================================================

# 唯一标识符
id: my-scene

# 显示名称
name: My Scene

# 场景描述
description: >
  对这个场景的简要描述：模拟什么情境、达成什么目的。

# 学习/交互目标
objective: >
  学员通过本场景应掌握的核心能力或知识。

# 参与者（至少 1 个）
participants:
  - agent_id: agent-a              # 引用 pack 中已定义的 agent
    role_in_scene: 问题发起者        # 此场景中的角色
    speaking_style: 语气急切，困惑    # 此场景中的说话风格（可选，覆盖 agent 默认）
  - agent_id: agent-b
    role_in_scene: 问题解答者
    speaking_style: 耐心、有条理

# 入口 Agent（可选，不指定则第一个 participant 开始）
entry_agent_id: agent-a

# 流程步骤（核心）
flow:
  # --- 步骤类型说明 ---
  # narration  : 旁白/叙述（展示背景信息）
  # dialogue   : 对话（agent 之间或 agent 对用户说话）
  # breakpoint : 断点（等待用户输入）
  # transition : 过渡（场景切换/时间跳跃）

  - step_id: opening
    type: narration
    speaker: system
    content: >
      现在是周一早上 9:00，Agent-A 遇到一个问题需要求助。
    visual_hint: 办公室场景，Agent-A 坐在电脑前皱着眉头

  - step_id: agent-a-speaks
    type: dialogue
    speaker: agent-a
    content: >
      你好，我这边遇到了一个问题，能帮我看看吗？
    next_step_id: user-response

  - step_id: user-response
    type: breakpoint
    prompt: "你想如何回应？"
    allowed_agents:
      - agent-b
    user_input_mode: free_text
    next_step_id: agent-b-responds

  - step_id: agent-b-responds
    type: dialogue
    speaker: agent-b
    content: >
      当然可以，请详细描述一下你遇到的情况。
    source_refs:
      - knowledge/procedures.md

  - step_id: closing
    type: narration
    speaker: system
    content: >
      问题得到了初步分析和建议。双方约定了后续跟进计划。

# 断点配置（可选，也可以直接在 flow 中定义 breakpoint 类型步骤）
breakpoints:
  - step_id: user-response
    prompt: "你想如何回应？"
    allowed_agents:
      - agent-b
    user_input_mode: free_text

# 场景元数据（可选）
metadata:
  difficulty: intermediate        # beginner | intermediate | advanced | expert
  estimated_duration_min: 15
  tags:
    - 演练
    - 问题排查
